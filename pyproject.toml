[project]
name = "agent-stego"
version = "0.3.0"
description = "Research baselines for covert channels and defenses in AI-agent systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["ai-safety", "steganography", "covert-channels", "token-likelihood", "arithmetic-coding", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
token = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "accelerate>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff.lint]
# Pin the release gate instead of inheriting Ruff defaults that may change.
# The selected rules cover syntax/import failures, undefined names, mutable or
# late-bound defaults, lost exception context, swallowed errors, dynamic code
# execution, SQL/shell injection patterns, and stale suppression comments.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B006",
    "B008",
    "B012",
    "B017",
    "B023",
    "B904",
    "BLE001",
    "S102",
    "S110",
    "S112",
    "S307",
    "S608",
    "S609",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Trial runners intentionally catch provider/model failures and record them as
# observations. Reusable library code receives no such exception.
"experiments/*.py" = ["BLE001", "S608"]
"scripts/*.py" = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
